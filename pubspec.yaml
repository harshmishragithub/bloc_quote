name: bloc_quote
description: "Clean Architecture Quotes App with BLoC"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Networking
  dio: ^5.8.0+1

  # Functional Programming (Either)
  dartz: ^0.10.1

  # Event Transformer (debounce + droppable)
  bloc_concurrency: ^0.3.0
  stream_transform: ^2.1.0

  # Dependency Injection
  get_it: ^8.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
